<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>EventSnap | Home</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/create_event.css">
    <link rel="stylesheet" href="./css/events.css">
    <script src="./scripts/main.js" defer></script>
</head>
<body>

<aside class="sidebar" id="sidebar">

    <div class="sidebar__logo">
        <img class="sidebar__logo--collapsed" src="./img/main_page/cloud_logo.svg" alt="EventSnap">
        <img class="sidebar__logo--expanded" src="./img/main_page/logo_expand.svg" alt="EventSnap">
    </div>

    <button class="sidebar__btn sidebar__btn--create" id="openCreateModal">
        <img src="./img/main_page/btn_create1.svg" alt="Создать">
        <span class="sidebar__label">Создать</span>
        <svg class="sidebar__btn-plus sidebar__label" width="25" height="25" viewBox="0 0 25 25" fill="none">
            <line x1="12.5" y1="2" x2="12.5" y2="23" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="2" y1="12.5" x2="23" y2="12.5" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
    </button>
    <button class="sidebar__btn sidebar__btn--add">
        <img src="./img/main_page/btn_add1.svg" alt="Добавить">
        <span class="sidebar__label">Добавить</span>
        <svg class="sidebar__btn-plus sidebar__label" width="25" height="25" viewBox="0 0 25 25" fill="none">
            <line x1="12.5" y1="2" x2="12.5" y2="23" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <line x1="2" y1="12.5" x2="23" y2="12.5" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
    </button>
    <button class="sidebar__btn sidebar__btn--file">
        <img src="./img/main_page/folderbtn.svg" alt="Мероприятия">
        <span class="sidebar__label">Мероприятия</span>
    </button>
    <button class="sidebar__btn sidebar__btn--rubbish">
        <img src="./img/main_page/btn_rub1.svg" alt="Корзина">
        <span class="sidebar__label">Корзина</span>
    </button>
    <button class="sidebar__btn sidebar__btn--hide" id="sidebarToggle">
        <img src="./img/main_page/btn_hide.svg" alt="Свернуть">
        <span class="sidebar__label">Свернуть меню</span>
    </button>

    <div class="auth">
        <button class="auth__btn auth__btn--login">Войти</button>
        <button id="openModal" class="auth__btn auth__btn--register">
            Регистрация
        </button>
    </div>

    <!-- МОДАЛКА СОЗДАТЬ МЕРОПРИЯТИЕ -->
    <div class="modal" id="createModal">
        <div class="modal__content create-modal">

            <div class="create-modal__header">
                <button class="create-modal__back" id="closeCreateModal">&#8592;</button>
                <h2 class="create-modal__title">Создать мероприятие</h2>
            </div>

            <form class="create-modal__form">
                <input class="create-modal__input" type="text" placeholder="Введите название">
                <input class="create-modal__input" type="text" placeholder="Введите место проведения">
                <input class="create-modal__input" type="date" placeholder="Введите дату">
                <button type="submit" class="create-modal__submit">Создать</button>
            </form>

        </div>
    </div>

    <!-- МОДАЛКА РЕГИСТРАЦИИ -->
    <div class="modal" id="modal">
        <div class="modal__content">

            <button class="modal__back" id="closeModal">←</button>

            <h2 class="modal__title">Зарегистрироваться</h2>

            <form class="modal__form">
                <input type="email" placeholder="Введите e-mail">
                <input type="password" placeholder="Введите пароль">
                <input type="password" placeholder="Повторно введите пароль">

                <button type="submit" class="modal__submit">
                    Зарегистрироваться
                </button>
            </form>

            <div class="modal__divider"></div>

            <button class="yandex-btn">
                <span class="yandex-btn__icon">
                    <img src="https://encrypted-tbn2.gstatic.com/faviconV2?url=https://yandex.ru&client=VFE&size=64&type=FAVICON&fallback_opts=TYPE,SIZE,URL&nfrp=2">
                </span>
                <span class="yandex-btn__text">Войти с Яндекс ID</span>
            </button>

        </div>
    </div>

</aside>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<main class="main-content">

    <!-- СПИСОК МЕРОПРИЯТИЙ -->
    <div class="view" id="viewList">
        <header class="main-header">
            <h1 class="main-header__title">Мероприятия</h1>
        </header>
        <div class="events-grid" id="eventsGrid"></div>
    </div>

    <!-- СТРАНИЦА МЕРОПРИЯТИЯ -->
    <div class="view view--hidden" id="viewEvent">
        <header class="main-header main-header--event">
            <button class="back-btn" id="backToList">&#8592;</button>
            <h1 class="main-header__title" id="eventTitle"></h1>
        </header>
        <input type="file" id="photoInput" accept=".jpg,.jpeg,.png" multiple hidden>
        <div class="photos-grid" id="photosGrid"></div>
    </div>

</main>

</body>
</html>
